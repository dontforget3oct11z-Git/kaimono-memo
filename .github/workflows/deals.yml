name: お店のお得日を取り込む

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00（日本時間）
    - cron: "0 9 * * *"    # 毎日 18:00（日本時間）
  workflow_dispatch:       # Actions 画面から手動でも実行できる
  push:
    branches: [main]
    paths: [stores.json, "scripts/**"]

permissions:
  contents: write

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 読み取りのテスト
        run: node --test scripts/test/*.test.mjs
      - name: お得日を取り込む
        run: node scripts/fetch-deals.mjs
      - name: 変更があれば保存する
        run: |
          if [ -n "$(git status --porcelain deals.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add deals.json
            git commit -m "お得日を更新"
            git pull --rebase
            git push
          fi
